<!DOCTYPE html>
<html>
<head>
    <title>To-Do App</title>
</head>
<body>
    <h1>To-Do App</h1>

    <form action="/add" method="post">
        <input type="text" name="task" placeholder="New Task">
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for task in tasks %}
        <li>
            {{ task }} 
            <a href="/edit/{{ loop.index0 }}">Edit</a>
            <a href="/delete/{{ loop.index0 }}">Delete</a>
        </li>
        {% endfor %}
    </ul>
    <style>
        .site-footer {
            position: fixed;
            right: 12px;
            bottom: 12px;
            color: #fff;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.45);
            padding: 6px 10px;
            border-radius: 8px;
            z-index: 9999;
        }
    </style>
    <footer class="site-footer">Made by Ali Salman Abuidrees (NV23155)</footer>
</body>
</html>
